name: Validate research pipeline

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # cvxpy is a test-only dependency: the pipeline solves with SLSQP, and the
      # tests check that answer against a certified convex optimum.
      - run: pip install cvxpy
      - run: python -m pytest -q
      - run: python run_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-outputs
          path: outputs/

  matlab-cross-check:
    # The independent implementation is only worth having if it actually runs.
    # Octave executes the same .m files, so the cross-check is verified on every
    # push without needing a MATLAB licence in CI.
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Cross-check the optimizer against the MATLAB implementation
        run: octave --no-gui matlab/verify_against_python.m
